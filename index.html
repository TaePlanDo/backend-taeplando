<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaePlanDo — wkrótce</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fc;
        color: #172033;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 12% 15%, #dce6ff 0, transparent 31rem),
          radial-gradient(circle at 88% 82%, #d5f5e7 0, transparent 30rem),
          #f7f8fc;
      }

      main {
        width: min(100%, 720px);
        padding: 56px;
        border: 1px solid #e2e6f0;
        border-radius: 28px;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 24px 72px rgb(31 43 74 / 12%);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #4f5c7a;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.065em;
      }

      p {
        max-width: 52ch;
        margin: 26px 0 0;
        color: #4f5c7a;
        font-size: 1.1rem;
        line-height: 1.65;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #e8f8ef;
        color: #176d43;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
      }

      @media (max-width: 560px) {
        main { padding: 36px 28px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TaePlanDo</p>
      <h1>Trenuj świadomie. Rozwijaj się pewnie.</h1>
      <p>
        To tymczasowa strona startowa projektu TaePlanDo. Wkrótce znajdziesz tu
        wszystko, czego potrzebujesz, aby zaplanować swój trening.
      </p>
      <div class="status"><span class="dot"></span> Strona jest w przygotowaniu</div>
    </main>
  </body>
</html>

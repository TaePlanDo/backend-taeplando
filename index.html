<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaePlanDo — wkrótce</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #14213d;
        background: #f6f8fc;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
        padding: 48px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 56px rgb(20 33 61 / 13%);
      }

      .label {
        margin: 0 0 16px;
        color: #496a9c;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4.6rem);
        letter-spacing: -0.06em;
        line-height: 1;
      }

      p:not(.label) {
        max-width: 48ch;
        color: #53627b;
        font-size: 1.1rem;
        line-height: 1.65;
      }

      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #e5f6ec;
        color: #167344;
        font-size: 0.9rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">TaePlanDo</p>
      <h1>Plan treningowy w jednym miejscu.</h1>
      <p>
        To tymczasowa strona startowa projektu TaePlanDo. Wkrótce udostępnimy
        tutaj narzędzia do planowania treningów i śledzenia postępów.
      </p>
      <span class="badge">Strona w przygotowaniu</span>
    </main>
  </body>
</html>

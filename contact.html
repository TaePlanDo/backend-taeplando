<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaePlanDo — Kontakt</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #1b2435;
        background: #f4f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        padding: 40px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 48px rgb(27 36 53 / 12%);
      }

      p { color: #60708c; line-height: 1.6; }

      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 18px;
        border-radius: 8px;
        background: #234a91;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Skontaktuj się z TaePlanDo</h1>
      <p>
        To przykładowa strona kontaktowa. Docelowe dane kontaktowe pojawią się
        tutaj wraz ze startem aplikacji.
      </p>
      <a href="mailto:kontakt@example.com">Napisz do nas</a>
    </main>
  </body>
</html>

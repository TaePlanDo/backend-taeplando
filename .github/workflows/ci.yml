name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taeplando
          POSTGRES_USER: taeplando
          POSTGRES_PASSWORD: taeplando
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taeplando -d taeplando"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://taeplando:taeplando@localhost:5432/taeplando
        run: uv run alembic upgrade head

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://taeplando:taeplando@localhost:5432/taeplando
        run: uv run pytest

      - name: Verify Alembic migration round trip
        env:
          DATABASE_URL: postgresql+asyncpg://taeplando:taeplando@localhost:5432/taeplando
        run: |
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: TaePlanDo/frontend-taeplando
          path: frontend-taeplando
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-taeplando/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-taeplando
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend-taeplando
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend-taeplando
        run: npm run test:e2e -- --backend-dir=${{ github.workspace }}

name: PR Jira

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  jira-link:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and ensure Jira link
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.trim();
            const match = title.match(/^(SCRUM-\d+) (.+)$/);
            if (!match) {
              core.setFailed(
                'Bad PR title. Use: SCRUM-8 feat/add-initial-setup (ticket, space, description)'
              );
              return;
            }

            const ticket = match[1];
            const jiraUrl = `https://kiai-karate-zpi.atlassian.net/browse/${ticket}`;
            const start = "<!-- jira-link -->";
            const end = "<!-- /jira-link -->";
            const block = `${start}\n## Jira\n${jiraUrl}\n${end}`;

            let body = context.payload.pull_request.body || "";
            if (body.includes(start) && body.includes(end)) {
              body = body.replace(
                new RegExp(`${start}[\\s\\S]*?${end}`, "m"),
                block,
              );
            } else {
              body = body.trim() ? `${block}\n\n${body.trim()}` : block;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
            });
